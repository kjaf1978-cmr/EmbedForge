; Block moulding machine firmware (P9, D24, D48): Arduino C++ for the Arduino Mega 2560, built with PlatformIO.
;   pio run -e mega                  build
;   pio run -e mega -t upload        build and flash over USB
;   pio test -e native               the host unit tests (the same as `make test`)
; SPDX-License-Identifier: GPL-3.0-or-later

[platformio]
src_dir = src
test_dir = test

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -Wall

[env:native]
platform = native
test_framework = custom
build_src_filter = +<*> -<main.cpp>
test_build_src = yes
