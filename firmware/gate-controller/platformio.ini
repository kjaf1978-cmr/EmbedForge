; Gate controller firmware (P9, D48): Arduino C++ for the Arduino Nano, built with PlatformIO.
;   pio run -e nano                  build
;   pio run -e nano -t upload        build and flash over USB
;   pio test -e native               the host unit tests (the same as `make test`)
; SPDX-License-Identifier: GPL-3.0-or-later

[platformio]
src_dir = src
test_dir = test

[env:nano]
platform = atmelavr
board = nanoatmega328new          ; the new bootloader (Optiboot) only: the old one loops after a watchdog reset
framework = arduino
build_flags = -Wall

[env:native]
platform = native
test_framework = custom
build_src_filter = +<*> -<main.cpp>
test_build_src = yes
