[workspace]
resolver = "2"
members = ["ef-schema", "ef-cm", "ef-integrity", "ef-host", "ef-diag"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
minisign-verify = "0.3"
semver = { version = "1", features = ["serde"] }
minisign = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
