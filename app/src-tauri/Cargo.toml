[package]
name = "embedforge"
description = "EmbedForge desktop application shell (Tauri 2)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ef-schema = { path = "../../core/ef-schema" }
ef-cm = { path = "../../core/ef-cm" }
ef-integrity = { path = "../../core/ef-integrity" }
ef-host = { path = "../../core/ef-host" }
ef-diag = { path = "../../core/ef-diag" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
