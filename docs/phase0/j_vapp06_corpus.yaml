# ---------------------------------------------------------------- Uno
- id: V06-006
  board: uno
  difficulty: simple
  prompt: "Light a red LED when the push button is pressed. Use pin 2 for the button."
  parts: [led, resistor, push_button]
  nl02_note: "'when pressed' can mean while held or toggle on each press (event semantics)."
  expected_questions:
    - {id: q1, type: f, signal: button, text: "LED on while the button is held, or toggle on each press?", default: "on while held, 20 ms debounce, internal pull-up"}
  scripted_answers:
    - {q: q1, answer: "toggle on each press"}
  assertions:
    - {at_ms: 0, stimulus: {button: 0}, expect: {led: 0}}
    - {at_ms: 100, stimulus: {button: 1}, expect: {}}
    - {at_ms: 200, stimulus: {button: 0}, expect: {led: 1}}
    - {at_ms: 400, stimulus: {button: 1}, expect: {}}
    - {at_ms: 500, stimulus: {button: 0}, expect: {led: 0}}
  outcome: verified_auto

