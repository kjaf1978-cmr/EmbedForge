- id: V06-008
  board: uno
  difficulty: hard
  prompt: "Night light for a child's room: switch the LED on when it is dark and switch it off when the LDR reads less than 300. Use the potentiometer to set the darkness threshold."
  parts: [ldr, potentiometer, led, resistor]
  nl02_note: "Fixed threshold 300 contradicts the potentiometer threshold, and a low LDR reading means dark in the default divider, contradicting 'off'; no hysteresis or units."
  expected_questions:
    - {id: q1, type: b, signal: led, text: "Threshold is both fixed (300) and set by the potentiometer, and 'off below 300' contradicts 'on when dark': which applies?", default: "potentiometer sets the threshold; LED on when light level < threshold"}
    - {id: q2, type: d, signal: ldr, text: "Hysteresis for the dark/light comparison?", default: "5 % of full scale"}
    - {id: q3, type: e, signal: ldr, text: "Unit and direction of the light reading (raw ADC or %, LDR to GND or to 5 V)?", default: "light level 0-100 %, LDR to 5 V with 10 kΩ to GND (higher = brighter)"}
  scripted_answers:
    - {q: q1, answer: "accept default"}
    - {q: q2, answer: "accept default"}
    - {q: q3, answer: "accept default"}
  assertions:
    - {at_ms: 0, stimulus: {pot_pct: 30, light_pct: 80}, expect: {led: 0}}
    - {at_ms: 500, stimulus: {light_pct: 20}, expect: {led: 1}}
    - {at_ms: 1000, stimulus: {light_pct: 33}, expect: {led: 1}}
    - {at_ms: 1500, stimulus: {light_pct: 40}, expect: {led: 0}}
  outcome: verified_auto

