- id: V06-003
  board: uno
  source: ACC-02 (Uno)
  difficulty: hard
  prompt: "Create a module with 2 generic analog inputs (named A and B), 3 generic digital inputs (named C, D, E), 2 digital outputs (named U and V) and one analog output (named W). Whenever A is equal to B, switch U ON. Whenever C and D are ON but E is OFF, increment the value of U, output it on a PWM output of the board and set the speed of a controlled motor proportionally."
  parts: [resistor, capacitor, diode, led, tb6612fng, dc_motor, x_terminal_block]
  nl02_note: "ACC-02(a) items 1-10: analog equality without tolerance, U used as digital and counter, missing edge semantics, unused V/W, no DAC on Uno, missing ranges."
  expected_questions:
    - {id: q1, type: d, signal: "A/B", text: "Tolerance and hysteresis for A = B?", default: "±0.05 V, hysteresis 0.02 V"}
    - {id: q2, type: c, signal: U, text: "U is digital but incremented and output as PWM: separate counter/PWM signal or redefine U?", default: "separate 8-bit counter N driving PWM output P; U stays digital"}
    - {id: q3, type: f, signal: U, text: "Increment on rising edge or at a rate while held; counter range; wrap or saturate; reset?", default: "rising edge, 0..255, saturate, reset at power-up"}
    - {id: q4, type: a, signal: motor, text: "Motor speed proportional to which quantity, with which scaling?", default: "counter N, 0..255 → 0..100 % duty"}
    - {id: q5, type: e, signal: motor, text: "Motor type, voltage, current and driver?", default: "6 V brushed DC, 0.5 A, TB6612FNG, separate 6 V supply"}
    - {id: q6, type: g, signal: W, text: "Behaviour of W, or remove it?", default: "W = copy of A"}
    - {id: q7, type: g, signal: V, text: "Behaviour of V, or remove it?", default: "remove V"}
    - {id: q8, type: h, signal: W, text: "Uno has no DAC: PWM + RC filter or external DAC for W?", default: "PWM + RC filter (ED-04c)"}
    - {id: q9, type: e, signal: "A/B", text: "Voltage ranges of A and B?", default: "0-5 V"}
    - {id: q10, type: a, signal: "C/D/E", text: "Type of C, D, E inputs, pull-up/pull-down and debounce?", default: "active-high, external 10 kΩ pull-down, 20 ms debounce"}
  scripted_answers:
    - {q: q1, answer: "accept default"}
    - {q: q2, answer: "accept default"}
    - {q: q3, answer: "accept default"}
    - {q: q4, answer: "accept default"}
    - {q: q5, answer: "accept default"}
    - {q: q6, answer: "accept default"}
    - {q: q7, answer: "accept default"}
    - {q: q8, answer: "accept default"}
    - {q: q9, answer: "accept default"}
    - {q: q10, answer: "accept default"}
  assertions:
    - {at_ms: 0, stimulus: {A: 2.50, B: 2.53, C: 0, D: 0, E: 0}, expect: {U: 1, N: 0}}
    - {at_ms: 100, stimulus: {B: 3.00}, expect: {U: 0}}
    - {at_ms: 200, stimulus: {C: 1, D: 1}, expect: {}}
    - {at_ms: 300, expect: {N: 1}}
    - {at_ms: 1300, expect: {N: 1}}
    - {at_ms: 1400, stimulus: {C: 0}, expect: {}}
    - {at_ms: 1500, stimulus: {C: 1}, expect: {}}
    - {at_ms: 1600, expect: {N: 2, P_duty_pct: "between 0.5 1.1", motor_speed_pct: "between 0.5 1.1"}}
    - {at_ms: 1700, stimulus: {E: 1, C: 0}, expect: {}}
    - {at_ms: 1800, stimulus: {C: 1}, expect: {N: 2}}
    - {at_ms: 3000, stimulus: {A: 1.20}, expect: {W: "between 1.10 1.30"}}
  outcome: verified_auto

