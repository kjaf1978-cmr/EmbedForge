# Phase 0 (j) — Draft VAPP-06 LLM regression corpus
#
# Assertion DSL (executable emulation assertions, EM-07 / VER-05):
#   - at_ms: time since scenario start (ms). Stimuli persist until changed.
#   - stimulus: {<signal>: <value>} applied at at_ms (optional).
#   - expect: {<signal>: <value> | "<op> <value>" | "between <lo> <hi>"}
#     ops: ==, !=, <, <=, >, >= ; booleans as 0/1 ; analog values in the unit
#     fixed by the scripted answers (V, °C, %, cm, ...). Duty cycles in percent.
# Entry-level hil_pending: true marks RP2350 targets (Pico 2 / Pico 2 W): no
# qualified emulator (Phase 0 (m)), so assertions run on HIL only (TB-02).
# Defaults written "accept default" in scripted_answers take the question's default.

title: "EmbedForge VAPP-06 LLM regression corpus (draft)"
baseline: "prompt v3.3"
version: "0.1.0"
date: "2026-10-05"
status: draft
review_record: pending
matching_rule: "a raised question matches an expected one when both NL-02 type and signal tags match"
thresholds_note: "pass criteria per VAPP-06, confirmed in Phase 0 (h)"

entries:

# ---------------------------------------------------------------- ACC-01 / ACC-02
- id: V06-001
  board: uno
  source: ACC-01 (Uno shield)
  difficulty: hard
  prompt: "Temperature-controlled fan: DHT22 sensor, PWM fan via MOSFET, 16×2 I²C LCD, alarm LED above 35 °C"
  parts: [dht22, mosfet, diode, resistor, capacitor, lcd1602_i2c, led, x_pwm_fan]
  nl02_note: "ACC-01(a) items 1-7: fan, PWM, control law, hysteresis, LCD, read interval and fault behaviour are unspecified; the 5 V LCD matches the 5 V Uno, so item 8 does not arise."
  expected_questions:
    - {id: q1, type: e, signal: fan, text: "Fan type (2-, 3- or 4-wire), voltage and current?", default: "4-wire 12 V DC fan, 0.25 A, separate 12 V supply"}
    - {id: q2, type: e, signal: fan_pwm, text: "PWM frequency?", default: "25 kHz (Timer1)"}
    - {id: q3, type: a, signal: fan, text: "Control law temperature → fan speed and its range?", default: "proportional, 0 % at 25 °C to 100 % at 35 °C"}
    - {id: q4, type: d, signal: temperature, text: "Hysteresis for the 35 °C alarm and for fan switching?", default: "1 °C for both"}
    - {id: q5, type: a, signal: lcd, text: "LCD content, layout and refresh rate?", default: "line 1 T and RH, line 2 fan % and ALARM flag, refresh 1 s"}
    - {id: q6, type: f, signal: dht22, text: "DHT22 read interval?", default: "2 s"}
    - {id: q7, type: e, signal: dht22, text: "Behaviour on sensor failure or out-of-range reading?", default: "after 3 failed reads: fan 100 %, alarm LED blinks 1 Hz, LCD shows SENSOR ERR"}
  scripted_answers:
    - {q: q1, answer: "accept default"}
    - {q: q2, answer: "accept default"}
    - {q: q3, answer: "accept default"}
    - {q: q4, answer: "accept default"}
    - {q: q5, answer: "accept default"}
    - {q: q6, answer: "accept default"}
    - {q: q7, answer: "accept default"}
  assertions:
    - {at_ms: 0, stimulus: {temperature: 22.0, humidity: 50}, expect: {fan_duty_pct: 0, alarm_led: 0}}
    - {at_ms: 5000, stimulus: {temperature: 30.0}, expect: {fan_duty_pct: "between 45 55", alarm_led: 0, fan_pwm_hz: "between 24000 26000"}}
    - {at_ms: 10000, stimulus: {temperature: 36.0}, expect: {fan_duty_pct: 100, alarm_led: 1}}
    - {at_ms: 15000, stimulus: {temperature: 34.5}, expect: {alarm_led: 1}}
    - {at_ms: 20000, stimulus: {temperature: 33.8}, expect: {alarm_led: 0, lcd_temp_shown: "between 33.7 33.9"}}
    - {at_ms: 25000, stimulus: {dht22_fail: 1}, expect: {}}
    - {at_ms: 33000, expect: {fan_duty_pct: 100, lcd_error_shown: 1, alarm_led_blink_hz: "between 0.9 1.1"}}
  outcome: verified_auto

